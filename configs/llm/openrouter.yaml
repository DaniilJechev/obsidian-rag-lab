name: sprint21-openrouter-generate
# Process default when POST /generate omits body.model.
# Bake-off overrides come from ragas.yaml generate_model / --generate-model.
model: openai/gpt-4o-mini
base_url: https://openrouter.ai/api/v1
timeout_seconds: 60
temperature: 0.2
max_output_tokens: 2000
max_context_tokens: 1800
min_retrieval_score: 0.0
http_referer: https://github.com/DaniilJechev/obsidian-rag-lab
app_title: obsidian-rag-lab
