[project]
name = "rag-based-on-obsidian"
version = "0.1.0"
description = "Production-like RAG pipeline over a read-only Obsidian vault"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.4",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.2",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "ragas>=0.4.3",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
rag-cli = "rag_based_on_obsidian.cli_rag:main"
chunking-cli = "rag_based_on_obsidian.chunking.chunking_cli:main"
embedding-smoke = "rag_based_on_obsidian.embeddings.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Default torch from PyPI on Linux pulls CUDA + nvidia-* (2GB+). This project
# embeds on CPU only; pin the CPU wheel index so Docker/Linux match Windows.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not manual' --basetemp .pytest-tmp --import-mode=importlib"
markers = [
    "manual: tests requiring explicit local resources or elevated Windows execution",
]
