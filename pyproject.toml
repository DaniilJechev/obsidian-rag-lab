[project]
name = "rag-based-on-obsidian"
version = "0.1.0"
description = "Production-like RAG pipeline over a read-only Obsidian vault"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "langchain-core>=1.5.4",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
]

[project.scripts]
experiments-cli = "rag_based_on_obsidian.chunking.experiments.experiments_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not manual' --basetemp .pytest-tmp"
markers = [
    "manual: tests requiring explicit local resources or elevated Windows execution",
]
