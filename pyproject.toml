[project]
name = "rag-based-on-obsidian"
version = "0.1.0"
description = "Production-like RAG pipeline over a read-only Obsidian vault"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
markers = [
    "manual: tests that require the external read-only Obsidian vault",
]
